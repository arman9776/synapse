<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>سیناپس | Synapse</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vazirmatn Font -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Vazirmatn', sans-serif; background-color: #0B0F19; color: #ffffff; padding-bottom: 80px; }
    .card { background-color: #111827; border: 1px solid #1f2937; border-radius: 1rem; padding: 1rem; margin-bottom: 1rem; }
    /* Hide arrows in number inputs */
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const ADVANCED_DRUGS = [
      {
        id: "norepi", name: "Norepinephrine", fa: "نوراپی‌نفرین", unit: "mcg/kg/min",
        defaultDose: 0.1, defaultAmount: 4, amountUnit: "mg", defaultVolume: 100,
        range: "0.01 تا 3 mcg/kg/min", antidote: "فنتولامین (Phentolamine)",
        dilution: "معمولاً ۴ میلی‌گرم در ۱۰۰ سی‌سی سرم قندی (DW5%)",
        warnings: ["خطر نکروز بافتی در صورت اکستراوازیشن", "ترجیحاً از لاین مرکزی (CVC) تزریق شود", "مانیتورینگ مداوم فشار خون الزامی است"]
      },
      {
        id: "amiodarone", name: "Amiodarone", fa: "آمیودارون", unit: "mg/min", 
        defaultDose: 1, defaultAmount: 150, amountUnit: "mg", defaultVolume: 100,
        range: "لودینگ: 150mg/10min | نگهدارنده: 1mg/min", antidote: "ندارد (درمان حمایتی/پیس‌میکر)",
        dilution: "فقط با سرم قندی (DW5%) رقیق شود",
        warnings: ["با سرم نمکی (NS) رسوب می‌کند!", "خطر افت شدید فشار خون و برادی‌کاردی", "حتماً با پمپ انفوزیون تزریق شود"]
      },
      {
        id: "tng", name: "Nitroglycerin (TNG)", fa: "نیتروگلیسیرین", unit: "mcg/min", 
        defaultDose: 10, defaultAmount: 5, amountUnit: "mg", defaultVolume: 100,
        range: "5 تا 200 mcg/min (مستقل از وزن)", antidote: "ندارد (قطع دارو و پوزیشن)",
        dilution: "۵ تا ۵۰ میلی‌گرم در ۱۰۰ یا ۲۵۰ سی‌سی DW5% یا NS",
        warnings: ["در صورت مصرف سیلدنافیل در ۲۴ ساعت گذشته منع مصرف مطلق دارد", "کنترل مداوم فشار خون هر ۵ دقیقه", "خطر سردرد شدید و افت فشار خون"]
      }
    ];

    function Num({ label, value, onChange, step }) {
      return (
        <label className="block">
          <span className="block text-sm font-bold text-gray-300 mb-1">{label}</span>
          <input className="w-full p-2 rounded-lg bg-[#0B0F19] border border-gray-700 text-white outline-none focus:border-[#00F0FF] transition-colors text-lg" type="number" step={step || "any"} dir="ltr" value={value} onChange={(e) => onChange(e.target.value)} />
        </label>
      );
    }

    function DrugCalc() {
      const [drugId, setDrugId] = useState(ADVANCED_DRUGS[0].id);
      const drug = ADVANCED_DRUGS.find((d) => d.id === drugId);
      const [w, setW] = useState("70");
      const [dose, setDose] = useState(String(drug.defaultDose));
      const [amt, setAmt] = useState(String(drug.defaultAmount));
      const [vol, setVol] = useState(String(drug.defaultVolume));

      const pick = (id) => {
        const d = ADVANCED_DRUGS.find((x) => x.id === id);
        setDrugId(id); setDose(String(d.defaultDose)); setAmt(String(d.defaultAmount)); setVol(String(d.defaultVolume));
      };

      const calculateRate = () => {
        const dNum = +dose; const wNum = +w; const aNum = +amt; const vNum = +vol;
        if (!dNum || !aNum || !vNum) return 0;
        const concMgPerMl = aNum / vNum;
        if (drug.unit === "mcg/kg/min") return (dNum * wNum * 60) / (concMgPerMl * 1000);
        if (drug.unit === "mcg/min") return (dNum * 60) / (concMgPerMl * 1000);
        if (drug.unit === "mg/min") return (dNum * 60) / concMgPerMl;
        return 0;
      };

      const rate = calculateRate();
      const needsWeight = drug.unit.includes("kg");

      return (
        <div className="space-y-4">
          <label className="block">
            <span className="block text-sm font-bold text-[#00F0FF] mb-1">انتخاب داروی پرخطر</span>
            <select className="w-full p-3 rounded-lg bg-[#0B0F19] border border-gray-700 text-white outline-none focus:border-[#00F0FF] font-bold" value={drugId} onChange={(e) => pick(e.target.value)}>
              {ADVANCED_DRUGS.map((d) => <option key={d.id} value={d.id}>{d.fa} — {d.name}</option>)}
            </select>
          </label>
          
          <div className="grid grid-cols-2 gap-4">
            {needsWeight && <Num label="وزن (kg)" value={w} onChange={setW} />}
            <Num label={`دوز (${drug.unit})`} value={dose} onChange={setDose} />
            <Num label={`مقدار (${drug.amountUnit})`} value={amt} onChange={setAmt} />
            <Num label="حجم سرم (ml)" value={vol} onChange={setVol} />
          </div>

          <div className="grid grid-cols-2 gap-3 mt-5">
            <div className="rounded-xl border border-[#00F0FF] bg-[#00F0FF]/10 p-4 text-center shadow-[0_0_15px_rgba(0,240,255,0.15)]">
              <p className="text-xs text-[#00F0FF] mb-1">پمپ (ml/hr)</p>
              <p className="text-4xl font-black text-[#00F0FF]" dir="ltr">{rate.toFixed(1)}</p>
            </div>
            <div className="rounded-xl border border-[#A855F7] bg-[#A855F7]/10 p-4 text-center shadow-[0_0_15px_rgba(168,85,247,0.15)]">
              <p className="text-xs text-[#A855F7] mb-1">میکروست (gtt/min)</p>
              <p className="text-4xl font-black text-[#A855F7]" dir="ltr">{Math.round(rate)}</p>
            </div>
          </div>
          
          <div className="rounded-xl border border-red-500 bg-red-500/10 p-4 mt-5">
            <p className="font-black text-red-500 mb-3 flex items-center gap-2">⚠️ هشدارهای بالینی</p>
            <div className="text-sm space-y-2 text-gray-200 leading-relaxed">
              <p><span className="font-bold text-red-400">آنتی‌دوت:</span> {drug.antidote}</p>
              <p><span className="font-bold text-yellow-400">رقیق‌سازی:</span> {drug.dilution}</p>
              <ul className="list-disc pr-5 mt-2 marker:text-red-500 space-y-1">
                {drug.warnings.map((x, i) => <li key={i}>{x}</li>)}
              </ul>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      return (
        <div>
          <header className="p-4 border-b border-gray-800 bg-[#111827] sticky top-0 z-10 shadow-lg">
            <p className="text-[10px] font-bold tracking-widest text-[#00F0FF]">SYNAPSE · سیناپس</p>
            <h1 className="text-xl font-black mt-1">اورژانس و بالین</h1>
          </header>
          <main className="p-4 max-w-md mx-auto">
            <div className="card">
              <h2 className="text-lg font-bold text-white mb-4 border-b border-gray-700 pb-2">💉 محاسبه‌گر داروهای پرخطر</h2>
              <DrugCalc />
            </div>
          </main>
          
          <nav className="fixed bottom-0 w-full bg-[#111827] border-t border-gray-800 flex justify-around p-2 text-xs text-gray-400 z-50">
            <div className="flex flex-col items-center text-[#00F0FF]"><span className="text-2xl mb-1">🚨</span>بالین</div>
            <div className="flex flex-col items-center"><span className="text-2xl mb-1">📋</span>شیفت</div>
            <div className="flex flex-col items-center -mt-6 bg-gradient-to-r from-[#00F0FF] to-[#A855F7] text-white p-3 rounded-full shadow-[0_0_15px_rgba(168,85,247,0.5)] border-4 border-[#0B0F19]"><span className="text-2xl">🧠</span></div>
            <div className="flex flex-col items-center"><span className="text-2xl mb-1">🎓</span>آزمون</div>
            <div className="flex flex-col items-center"><span className="text-2xl mb-1">📚</span>پروتکل</div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
